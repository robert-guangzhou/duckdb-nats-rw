name: nats-rw

services:
  nats:
    image: nats:2.11
    container_name: nats-rw-nats
    command: ["--jetstream", "--store_dir=/data", "--http_port=8222"]
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - nats-data:/data
    # 注意：nats:2.11 为无 shell 极简镜像，容器内无法执行 wget/sh，
    # 健康探测改由 builder 侧 curl http://nats:8222/healthz 完成（见 test/scripts/run-all.sh）。
    healthcheck:
      test: ["NONE"]

  # TP-04a 认证测试服务：用户名/密码（阶段四）
  nats_userpass:
    image: nats:2.11
    container_name: nats-rw-nats-userpass
    command: ["--jetstream", "--store_dir", "/data", "--user", "admin", "--pass", "s3cret-pass"]
    volumes:
      - nats-userpass-data:/data

  # TP-04b 认证测试服务：单 token（阶段四）
  nats_token:
    image: nats:2.11
    container_name: nats-rw-nats-token
    command: ["--jetstream", "--store_dir", "/data", "--auth", "tok-12345"]
    volumes:
      - nats-token-data:/data

  builder:
    build:
      context: ..
      dockerfile: docker/dev.Dockerfile
    container_name: nats-rw-builder
    working_dir: /workspace
    # fix-plan 2026-10-26：默认 seccomp 禁 personality(ADDR_NO_RANDOMIZE)，
    # setarch -R 不可用。放开 seccomp 后 debug+ASan 构建与测试可关 ASLR 运行，
    # 规避 宿主 mmap_rnd_bits=32 × gcc-12 旧 libasan 影子映射随机碰撞
    # → AddressSanitizer:DEADLYSIGNAL 无限风暴（见 plans/nats-rw-exit-storm-disk-guard-fix-plan.md）。
    security_opt:
      - seccomp:unconfined
    volumes:
      - ..:/workspace
      - cargo-cache:/usr/local/cargo/registry
      - cargo-git:/usr/local/cargo/git
    command: ["sleep", "infinity"]
    depends_on:
      nats:
        condition: service_started

  # 播种用（profile 控制）：docker compose --profile seed run --rm seeder sh /test/sql/fixtures/seed.sh
  seeder:
    image: synadia/nats-box:latest
    profiles: ["seed"]
    depends_on:
      nats:
        condition: service_started
    volumes:
      - ../test:/test:ro
    entrypoint: ["sleep", "infinity"]

volumes:
  nats-data:
  nats-userpass-data:
  nats-token-data:
  cargo-cache:
  cargo-git:
