name: CI v3 (community CI exact reproduction)
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || '' }}
  cancel-in-progress: true

jobs:
  community-ci-exact:
    name: Community CI exact (vcpkg + make release + all env vars)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Ninja
        run: sudo apt-get update -y -qq && sudo apt-get install -y -qq ninja-build

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11.1
        with:
          vcpkgGitCommitId: cd61e1e26a038e82d6550a3ebbe0fbbfe7da78e3

      - name: Build via make release (exact community CI command)
        env:
          # These are the exact env vars set by ci_phase.py build_environment()
          DUCKDB_PLATFORM: linux_amd64
          DUCKDB_PLATFORM_RTOOLS: '0'
          EXTENSION_NAME: nats_rw
          EXTENSION_CANONICAL: nats_rw
          ENABLE_EXTENSION_AUTOINSTALL: '1'
          ENABLE_EXTENSION_AUTOLOADING: '1'
          VCPKG_TOOLCHAIN_PATH: ${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake
          VCPKG_TARGET_TRIPLET: x64-linux
          CI: 'true'
        run: |
          echo "=== Tool versions ==="
          cmake --version | head -1
          rustc --version
          ninja --version
          echo
          echo "=== Running make release (community CI exact) ==="
          make release 2>&1 | tee make-release.log
          echo "MAKE_EXIT=$?"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: make-release-log
          path: make-release.log
          retention-days: 7

      - name: Show extension artifacts
        if: success()
        run: |
          find build/release -name "*.duckdb_extension" -exec ls -lh {} \; 2>/dev/null || echo "no extension artifacts"

  cargo-audit:
    name: Cargo Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: rust
