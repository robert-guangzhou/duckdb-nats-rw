name: CI v2 (vcpkg simulation)
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || '' }}
  cancel-in-progress: true

jobs:
  linux-vcpkg:
    name: Linux amd64 + vcpkg (simulates community CI)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - name: Show tool versions
        run: |
          echo "cmake: $(cmake --version | head -1)"
          echo "rust:  $(rustc --version)"
          echo "cargo: $(cargo --version)"
          echo "ninja: $(ninja --version 2>/dev/null || echo not-installed)"

      - name: Install Ninja
        run: sudo apt-get update -y -qq && sudo apt-get install -y -qq ninja-build

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11.1
        with:
          vcpkgGitCommitId: cd61e1e26a038e82d6550a3ebbe0fbbfe7da78e3

      - name: Configure (with vcpkg toolchain, same as community CI)
        run: |
          mkdir -p build/ci
          cmake \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DVCPKG_BUILD=1 \
            -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake \
            -DVCPKG_TARGET_TRIPLET=x64-linux \
            -DDUCKDB_EXTENSION_CONFIGS="${{ github.workspace }}/extension_config.cmake" \
            -S duckdb \
            -B build/ci \
            2>&1 | tee cmake_configure.log
          echo "=== CONFIGURE EXIT: $? ==="

      - name: Upload configure log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cmake-configure-log
          path: cmake_configure.log
          retention-days: 7

      - name: Build (Release)
        if: success()
        run: |
          cmake --build build/ci --config Release --parallel $(nproc) 2>&1 | tee build.log
          echo "=== BUILD EXIT: $? ==="

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7

      - name: Show extension artifacts
        if: success()
        run: |
          find build/ci -name "*.duckdb_extension" -exec ls -lh {} \;
          find build/ci -name "libnats_rw*" -exec ls -lh {} \;

      - name: Quick test (version only)
        if: success()
        run: |
          ./build/ci/test/unittest test/sql/nats_rw.test 2>&1 || true

  linux-novcpkg:
    name: Linux amd64 (no vcpkg, baseline comparison)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Ninja
        run: sudo apt-get update -y -qq && sudo apt-get install -y -qq ninja-build

      - name: Build (Release, no vcpkg)
        run: |
          mkdir -p build/novcpkg
          cmake \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DDUCKDB_EXTENSION_CONFIGS="${{ github.workspace }}/extension_config.cmake" \
            -S duckdb \
            -B build/novcpkg
          cmake --build build/novcpkg --config Release --parallel $(nproc)
          echo "=== BASELINE BUILD EXIT: $? ==="

      - name: Quick test
        if: success()
        run: |
          ./build/novcpkg/test/unittest test/sql/nats_rw.test 2>&1 || true

  cargo-audit:
    name: Cargo Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: rust
