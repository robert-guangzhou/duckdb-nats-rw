[package]
name = "nats_rw"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "NATS JetStream read/write core for the nats_rw DuckDB extension"

[lib]
crate-type = ["staticlib"]

[dependencies]
async-nats = "0.50"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
serde_json = "1"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
