language = "C"
include_guard = "NATS_RW_RUST_H"
autogen_warning = "/* Generated by cbindgen via rust/regen-header.sh. DO NOT EDIT. */"
# 容器内 cbindgen 版本不输出 extern "C" 守卫（旧头文件为手工补齐）；
# C++ 侧缺失守卫会按 mangling 引用符号 → dlopen 解析失败（2026-10-26 实测：
# nats_rw_runtime_shutdown 变 _Z24...v 未定义符号，LOAD 失败、测试全 skip）。
# 开守卫经 after_includes 注入；闭守卫由 regen-header.sh 后处理插入 include
# guard #endif 之前（cbindgen 的 trailer 会落在 guard 之外，重复包含时不平衡）。
after_includes = """
#ifdef __cplusplus
extern "C" {
#endif
"""
